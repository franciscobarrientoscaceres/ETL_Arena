[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etl-arena"
version = "0.1.0"
description = "Reingeniería del cálculo de disponibilidad PCS & baterías de Arena BESS (Excel/VBA -> Python + SQL Server)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2,<4",
    "openpyxl>=3.1",
    "tzdata>=2024.1",  # zoneinfo en Windows: clasificación de anomalías DST (R16.3)
]

[project.optional-dependencies]
sql = [
    "sqlalchemy>=2.0",
    "pyodbc>=5.2",
]
com = [
    "pywin32>=308; sys_platform == 'win32'",
]
dev = [
    "etl-arena[sql,com]",
    "hypothesis>=6.100",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "golden: requiere el libro .xlsm real (variable ETL_ARENA_XLSM o ruta por defecto en data/)",
    "sql: requiere SQL Server (docker/mssql.compose.yml) y ETL_ARENA_DB_URL",
    "excel: requiere Excel instalado (COM); solo PC local Windows",
]

[tool.coverage.run]
source = ["etl_arena"]
branch = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
