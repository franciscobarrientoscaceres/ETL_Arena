# SQL Server 2022 para desarrollo y tests de integración (marker `sql`).
# Uso:  docker compose -f docker/mssql.compose.yml --env-file .env up -d
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: etl-arena-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?definir MSSQL_SA_PASSWORD en .env}"
    ports:
      - "1433:1433"
    volumes:
      - etl-arena-mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  etl-arena-mssql-data:
